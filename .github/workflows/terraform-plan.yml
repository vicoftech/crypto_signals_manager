# Plan en PRs (no aplica cambios).
name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "src/**"
      - "scripts/build_lambda_bundle.sh"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda bundle
        run: bash scripts/build_lambda_bundle.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform plan
        id: plan
        working-directory: infra/terraform/app
        env:
          TF_VAR_aws_profile: ""
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          terraform init -input=false -backend-config=backends/ci.hcl
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/app/plan.txt', 'utf8');
            const body = `### Terraform plan\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
